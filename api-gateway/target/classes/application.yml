server:
  port: 8000

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/auth/**
        - id: product-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/products/**, /api/v1/categories/**
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/users/**
        - id: order-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/v1/orders/**
        - id: saga-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/saga/**

jwt:
  secret: mySecretKeyForJWTTokenGenerationAndValidation12345678901234567890

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG